<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Column Formatter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f6f8fa; }
        textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 14px; }
        button { background-color: #2da44e; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; margin-bottom: 15px;}
        button:hover { background-color: #2c974b; }
        .success-box { display: none; background-color: #dafbe1; color: #1a7f37; padding: 12px; border-radius: 6px; border: 1px solid #4ac26b; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>Direct Attendance Column Extractor</h2>
    <p>Paste the raw WhatsApp message text below:</p>
    <textarea id="inputText" placeholder="Paste your WhatsApp text block here..."></textarea>
    
    <button onclick="processAndCopy()">Extract & Copy Column</button>
    
    <div id="successMessage" class="success-box">Copied! Select the top cell of today's column in Excel and hit Ctrl+V.</div>

    <script>
        function processAndCopy() {
            const text = document.getElementById('inputText').value;
            const lines = text.split('\n');
            let outputStatuses = [];

            lines.forEach(line => {
                line = line.trim();
                
                // Only look at lines that have the " - " separator
                if (line.includes(" - ")) {
                    const parts = line.split(" - ");
                    const rightSide = parts[1].toUpperCase();

                    // Find the clean attendance code (IN, VL, MC, MA, HL)
                    const match = rightSide.match(/\b(IN|VL|MC|MA|HL)\b/);
                    
                    if (match) {
                        outputStatuses.push(match[1]);
                    } else {
                        // If no standard code is found but the line exists, keep a blank space to preserve row alignment
                        outputStatuses.push(""); 
                    }
                }
            });

            // Join them with newlines so they copy as a vertical Excel column
            const finalClipboardText = outputStatuses.join('\n');

            // Copy directly to your clipboard
            navigator.clipboard.writeText(finalClipboardText).then(() => {
                const msg = document.getElementById('successMessage');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 4000);
            });
        }
    </script>
</body>
</html>
