<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Formatter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f6f8fa; }
        textarea { width: 100%; height: 280px; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 14px; margin-bottom: 10px; }
        button { background-color: #2da44e; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 5px; margin-bottom: 15px;}
        button:hover { background-color: #2c974b; }
        .success-box { display: none; background-color: #dafbe1; color: #1a7f37; padding: 12px; border-radius: 6px; border: 1px solid #4ac26b; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>Attendance Formatter</h2>
    <p>Paste ALL your daily messages here (Office Hours + Rotas) in any order:</p>
    <textarea id="inputText" placeholder="Paste all WhatsApp updates here..."></textarea>
    
    <button onclick="processAndCopy()">Sort</button>
    
    <div id="successMessage" class="success-box">Copied!</div>

    <script>
        function processAndCopy() {
            let text = document.getElementById('inputText').value;
            
            // Convert any decorative long dashes (En Dash/Em Dash) into standard short hyphens
            text = text.replace(/[\u2010-\u2015—–]/g, "-");
            
            const lines = text.split('\n');
            
            let officeHours = [];
            let rota1 = [];
            let rota2 = [];
            let rota3 = [];
            
            let currentSection = "OFFICE_HOURS"; 

            lines.forEach(line => {
                const upperLine = line.trim().toUpperCase();
                
                if (upperLine.includes("OH NSF") || upperLine.includes("MOVEMENT CHART")) { currentSection = "OFFICE_HOURS"; return; }
                if (upperLine.includes("ROTA 1")) { currentSection = "ROTA_1"; return; }
                if (upperLine.includes("ROTA 2")) { currentSection = "ROTA_2"; return; }
                if (upperLine.includes("ROTA 3")) { currentSection = "ROTA_3"; return; }
                
                if (upperLine === "EMS TEAM:" || upperLine === "EMS TEAM") { return; } 

                if (line.includes("-")) {
                    const parts = line.split(/-+/);
                    if (parts.length >= 2) {
                        let rightSide = parts[1].toUpperCase().trim();
                        
                        // FIX: Forcefully strip out commas so "AM IN, PM MA" becomes "AM IN PM MA"
                        rightSide = rightSide.replace(/,/g, "").replace(/\s+/g, " ");
                        
                        let finalStatus = "";

                        // Condition 1: Map operational deployment tasks to standard "IN" status
                        if (rightSide.includes("ON DUTY") || rightSide.includes("HQ") || rightSide.includes("CDA")) {
                            finalStatus = "IN";
                        } else {
                            // Condition 2: Simplify "LATE" entries cleanly to "IN"
                            if (/\bIN\b.*LATE/.test(rightSide) || /LATE.*\bIN\b/.test(rightSide)) {
                                rightSide = "IN";
                            }

                            // Condition 3: Match layout complex composite phrases
                            const complexPhrases = [
                                "AM IN PM VL", "AM VL PM IN", "AM TO PM IN", "AM IN PM TO", 
                                "AM PM MC", "AM PM TO", "AM PM VL", "AM TO PM MIN", "AM PM HRI", 
                                "AM COA PM", "AM HRI PM", "AM PM HQ", "AM PM MMA", "AM PM TO MIN", "AM IN PM MA"
                            ];
                            
                            let foundComplex = complexPhrases.find(phrase => rightSide.includes(phrase));

                            if (foundComplex) {
                                finalStatus = foundComplex;
                            } else {
                                // Condition 4: Extract bracketed texts or single code words
                                const bracketMatch = rightSide.match(/\(([^)]+)\)/);
                                let potentialStatus = "";
                                
                                if (bracketMatch) {
                                    potentialStatus = bracketMatch[1].trim();
                                } else {
                                    const words = rightSide.match(/[A-Z0-9]+/g);
                                    if (words) {
                                        const cleanWords = words.filter(w => w !== "OFF" && w !== "DUTY");
                                        potentialStatus = cleanWords.length > 0 ? cleanWords[0] : words[0];
                                    }
                                }

                                if (potentialStatus) {
                                    potentialStatus = potentialStatus.replace(/\s+/g, '');
                                }

                                if (potentialStatus && !/[\d\/]/.test(potentialStatus)) {
                                    const validCodes = [
                                        "IN", "VL", "MC", "MA", "HL", "ADO", "BTO", "OFF", "RS", 
                                        "ORD", "OVL", "CCL", "CL", "OH", "STN41", "STN42", "STN43", 
                                        "VSCC", "HDAY", "RDR", "CDA", "HRI", "COURSE", "POSTEDOUT"
                                    ];
                                    
                                    if (validCodes.includes(potentialStatus)) {
                                        finalStatus = potentialStatus;
                                    } else {
                                        finalStatus = ""; 
                                    }
                                } else {
                                    finalStatus = ""; 
                                }
                            }
                        }

                        // Save to target sorting bucket
                        if (currentSection === "OFFICE_HOURS") officeHours.push(finalStatus);
                        if (currentSection === "ROTA_1") rota1.push(finalStatus);
                        if (currentSection === "ROTA_2") rota2.push(finalStatus);
                        if (currentSection === "ROTA_3") rota3.push(finalStatus);
                    }
                }
            });

            const totalOutput = [...officeHours, ...rota1, ...rota2, ...rota3];
            const finalClipboardText = totalOutput.join('\n');

            navigator.clipboard.writeText(finalClipboardText).then(() => {
                const msg = document.getElementById('successMessage');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 4000);
            });
        }
    </script>
</body>
</html>
